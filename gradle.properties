# ---------------------------------------------------------------------------
# Project-Ascension build properties
#
# Version policy (see docs/decisions/0001-target-minecraft-version-and-loader.md):
#   Runtime platform versions (Minecraft / NeoForge / Parchment) live HERE,
#   because they are also interpolated into neoforge.mods.toml at build time.
#   Gradle plugin and Java library versions live in gradle/libs.versions.toml.
#   Two files, one rule each -- do not duplicate a version across both.
# ---------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is off until M0.2 confirms ModDevGradle is compatible with it.
# Turn on, verify runClient still works, and record the result before leaving it on.
org.gradle.configuration-cache=false

# The system `java` on this machine is a Java 8 JRE and JAVA_HOME is unset.
# Pinning the JDK here makes the build reproducible regardless of PATH.
# See docs/technical/dev-environment.md ("Known trap").
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot

# --- Platform (pinned from maven, 2026-09-05) ---
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neoforge_version=21.1.249
# Compatibility floor, NOT the compile version. Set to the lowest NeoForge we actually
# need and raise it only when a module genuinely requires a newer API (ADR-0003:
# compatibility first). We compile against neoforge_version above.
neoforge_version_range=[21.1,)
loader_version_range=[4,)

# --- Garbage collector for dev runs --------------------------------------------
# zgc (default) or g1.
#
# G1's pauses are measured in tens of milliseconds, which against a 50 ms tick budget is a
# visible hitch. Generational ZGC (Java 21) keeps pauses under a millisecond, trading some
# throughput for it. Distant Horizons warns about G1 on sight, which is what first motivated
# this -- but the tick-budget argument for ZGC never depended on DH and holds on its own.
#
# Set to g1 to A/B it. Whichever is in use is part of any absolute performance reading -- see
# docs/technical/performance-log.md on what a baseline may be compared to.
jvm_gc=zgc

# --- Third-party mods loaded into dev runs -------------------------------------
# The dev server has to carry the same mods as the client test instance, or connecting fails.
# Both directions bite: Curios registers a network channel, so a client that has it refuses a
# server that does not -- and a server that has it refuses a client that does not.
#
# Rather than name each mod and its version here, the dev runs mirror the instance's mods
# folder. Two mods and a maven coordinate each was already a list that could drift; fourteen
# would be a list that *would* drift, silently, in whichever direction someone last clicked in
# CurseForge. Mirroring makes the two impossible to disagree.
#
# Set this empty to load no third-party mods at all. Our own jars are always skipped -- the dev
# run already has our code from source, and loading the built jar as well is a duplicate mod id.
dev_mods_dir=C:/Users/sanch/curseforge/minecraft/Instances/Ascension Dev/mods

# Extra filename fragments to keep off the *server* run, comma-separated.
#
# Usually unnecessary: the build already skips any mod whose neoforge.mods.toml declares only
# CLIENT-side dependencies, which is what keeps Sodium off the dedicated server. @Mod(dist =
# Dist.CLIENT) is NOT enough on its own -- Sodium registers an early-bootstrap window service
# that FML loads before mod loading, so the server dies on NoClassDefFoundError: org/lwjgl/
# Version before naming a single mod.
#
# This is for anything that heuristic misses: a mod declaring BOTH that crashes the server
# anyway. `./gradlew devMods` prints the split.
#
# immersivedamageindicators: its own neoforge.mods.toml does not declare every dependency
# CLIENT-side, so the heuristic classifies it "both" -- but Modrinth's own project metadata says
# server_side: unsupported, and its rendering-heavy feature set (custom fonts, animations) uses
# Mixins that reach into client-only classes. Loading it on the dedicated server crashed with
# ClassNotFoundException: net.minecraft.client.Minecraft during Mixin preprocessing, exactly the
# failure mode this property exists for.
dev_mods_server_exclude=immersivedamageindicators

# Curios, for the compat jar. Not a dev-runtime version any more -- that comes from the
# instance -- but `ascension-compat-curios` compiles against it and interpolates the range into
# its neoforge.mods.toml. Still never on a Tier 1 compile classpath (ADR-0003 rule 1).
curios_version=9.5.1+1.21.1
# Floor, not a pin -- same rule as neoforge_version_range.
curios_version_range=[9.5,)

# Chunky, for the compat jar. `ascension-compat-chunky` compiles against it (via Modrinth's
# maven, since Chunky is not on a conventional repository) and interpolates the range into its
# neoforge.mods.toml. Still never on a Tier 1 compile classpath (ADR-0003 rule 1). Also present
# as a dev-runtime mod via dev_mods_dir above -- that copy is unrelated to this one and could
# drift from it; this is what the compat jar actually compiles against.
chunky_version=1.4.23
# Floor, not a pin -- same rule as neoforge_version_range.
chunky_version_range=[1.4,)

# Jade, for the compat jar. `ascension-compat-jade` compiles against it (via Modrinth's maven,
# same as Chunky) purely to add Armor/Magic Resist lines to its entity tooltip -- no other API
# surface is used.
jade_version=15.10.6+neoforge
# Floor, not a pin -- same rule as neoforge_version_range.
jade_version_range=[15.10,)

# Immersive Damage Indicators, for the compat jar -- a pure rendering tweak (position/size of its
# floating numbers), no dependency on any Ascension module at all. Immersive Messages is IDI's own
# mandatory dependency (its own neoforge.mods.toml requires it), so it always accompanies IDI at
# runtime; still needed here at compile time since the compat jar's code references
# ImmersiveMessage directly. Forgified Fabric API's own needed class (net.fabricmc.fabric.api.event.Event)
# is vendored as a local jar instead -- see that module's build.gradle.kts for why.
immersivedamageindicators_version=neoforge-1.21.1-1.0.0
immersivedamageindicators_version_range=[1.0.0,)
immersivemessages_version=neoforge-1.21.1-1.0.18
# TxniLib is Immersive Messages' own mandatory dependency (its neoforge.mods.toml requires it),
# carrying the toni.lib.* package our pose-callback wrapper compiles against directly
# (AnimationTimeline, AnimationKeyframe). Guaranteed present at runtime the same way.
txnilib_version=neoforge-1.21.1-1.0.24

# Create, for the compat jar. Datapack parts need no API, but the Air Compressor does (see create_version) --
# the jar is pure datapack (recipe overrides + a hidden-from-recipe-viewers tag), no Java API of
# Create's is ever called -- so this range only interpolates into that jar's own
# neoforge.mods.toml required dependency, which is what keeps it from loading into a no-op when
# Create is absent (ADR-0003 rule 1).
create_version_range=[6.0.10,)
# The Create jar this compiles against (Modrinth maven, version number). Compile-only; the Air Compressor
# extends its kinetic classes, so the range above is a floor, not a pin.
create_version=6.0.10+mc1.21.1

# Sable, the physics mod under Create Aeronautics, for ascension-compat-sable: ships cross between
# planets and space through Sable's own ship save and load (SubLevelSerializer), which is internal,
# not its api package. So the range is pinned to the versions it was read against; a new Sable
# means re-reading that code before widening it (ADR-0006).
sable_version=2.0.5+mc1.21.1
sable_version_range=[2.0.5,2.0.7)

# Distant Horizons, for the compat jar, which makes its LOD clouds obey a dimension's own "no
# clouds" setting. Compiles against DH's public api package only (DhApi.Delayed.configs); the
# version is the one in the test instance. The api overrides it uses exist across 2.4 and 3.x.
distanthorizons_version=2.4.5-b-1.21.1
# Floor, not a pin -- same rule as neoforge_version_range.
distanthorizons_version_range=[2.4,)

# L_Ender's Cataclysm, for the compat jar. `ascension-compat-cataclysm` has no compile-time
# dependency on it either -- datapack overrides plus two ADR-0013 mixins that name Cataclysm's
# classes by string, so nothing compiles against Cataclysm's jar. "3.33",
# not the "1.21.1-3.33" CurseForge filename -- confirmed by reading Cataclysm's own
# neoforge.mods.toml, which declares its version as plain "3.33".
cataclysm_version_range=[3.33,)

# FTB Teams, for the compat jar (docs/progression/teams.md, ADR-0023). `ascension-compat-ftbteams`
# compiles against Teams' API and its two libraries (Library for the types in Teams' signatures,
# Architectury for its event bus), none of them bundled. Compile versions are the ones in the test
# instance; the ranges are floors, same rule as neoforge_version_range.
ftbteams_version=2101.1.11
ftbteams_version_range=[2101.1,)
ftblibrary_version=2101.1.37
architectury_version=13.0.11
architectury_version_range=[13.0,)

# FTB Quests, for the compat jar (docs/progression/quests.md). `ascension-compat-ftbquests` ships the
# quest book's theme and the "you are here" marker as resources and plain Minecraft code, so it has no
# compile-time dependency on Quests at all; this is only the floor NeoForge checks before loading it.
# 2101.1.36 is the version in the test instance, which the theme and the file format were read from.
ftbquests_version_range=[2101.1.36,)

# Enderman Overhaul, for the compat jar. `ascension-compat-endermanoverhaul` has no compile-time
# dependency on it -- the jar is a single NeoForge add_spawns biome modifier referencing its End
# Islands Enderman by registry id, no Java API of its own ever called. Also requires
# resourcefullib, resourcefulconfig and geckolib present in the mods folder at runtime (its own
# neoforge.mods.toml dependency list) -- none of them are Ascension's concern to declare here,
# since this jar never compiles against them either.
endermanoverhaul_version_range=[2.0.3,)

# Better Combat, for the compat jar. `ascension-compat-bettercombat` has no compile-time dependency
# on it (all rights reserved: referenced, never bundled) -- the jar is one weapon_attributes file
# per combat weapon, naming Better Combat's animations by id. Needs playeranimator and
# cloth_config at runtime (its own dependency list), not ours to declare.
bettercombat_version_range=[2.0,)

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# --- Mod metadata ---
mod_group_id=com.ascension
mod_version=0.1.0
mod_authors=Sanchit
mod_license=MIT

# JEI, for ascension-compat-jei (compile-only, the API jar from BlameJared's maven)
jei_version=19.51.0.418
jei_version_range=[19.0,)
