modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Sanchit-OP/Project-Ascension/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Ascension Atmosphere"
authors = "${mod_authors}"
description = '''
Breathable zones and oxygen, as a reusable system.

Any mod can register an AtmosphereProvider to declare what the air is like somewhere, an
OxygenSourceCollector to contribute tanks or suit reserves, or a DrainModifier to make an
activity cost air. Nothing needs to extend our classes.

Standalone: this mod depends only on NeoForge and works with no other Ascension module
installed. With no provider registered it does nothing, and everywhere stays breathable.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"

# Tier 0, and the only Ascension module this one depends on (ADR-0011). It carries the shared
# world-environment contract, so that a dimension mod can declare its worlds airless without
# either side knowing about the other.
#
# BEFORE, so its registry exists to be registered into during our setup.
[[dependencies.${mod_id}]]
modId = "ascension_core"
type = "required"
versionRange = "[0.1.0,)"
ordering = "BEFORE"
side = "BOTH"
