modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Sanchit-OP/Project-Ascension/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Ascension Compat: Create"
authors = "${mod_authors}"
description = '''
Removes Create's Copper/Netherite Backtank, Diving Helmet and Diving Boots from the game: no recipe
makes them, the recipe viewers and the creative menu hide them, and the advancements for earning them
are gone. A wearable tank of pressurised air that drains over time while worn is exactly what
ascension-atmosphere's own oxygen tank already is, under a different name and different rules --
shipping both invites exactly the confusion ADR-0002 exists to avoid -- and the netherite diving gear
lets a player swim in lava, which walks round the Nether.

Also makes raw helium (from ascension-worlds, when it is installed) a superheated blaze-burner fuel, the
highest grade. Also a fuel for Create Propulsion's Solid Fuel Thruster (a data file in Propulsion's own format, ignored when
Propulsion is absent), which is what makes helium rocket fuel (ADR-0030, superseding ADR-0025's thrusters).

Optional. Without Create installed, this jar simply is not present -- nothing else notices,
because nothing else knew this existed in the first place.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The actual integration target. Required, not optional -- same reasoning as
# ascension-compat-chunky: this jar has no other reason to exist, so if Create is absent NeoForge
# should refuse to load it rather than load it into a no-op. AFTER, not NONE: our recipe
# overrides need Create's own recipes already registered so this pack's copies are the ones that
# win the resource-location collision.
[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"

# The Air Compressor fills the air fluid of ascension-atmosphere's api (ADR-0026), so that mod is
# required now. It never depends on this one.
[[dependencies.${mod_id}]]
modId = "ascension_atmosphere"
type = "required"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "BOTH"
