modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Sanchit-OP/Project-Ascension/issues"

# ADR-0016: one mixin, giving new ships storage slots free in every dimension.
[[mixins]]
config = "sable_compat.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Ascension Compat: Sable"
authors = "${mod_authors}"
description = '''
The airship road to space. A Create Aeronautics ship that climbs past a planet's sky is carried
into space, crew and all, and one that reaches a planet in space is carried down to it. Moved
through Sable's own ship save and load, so its machinery comes with it. Ships float free in
space: no gravity there.

Optional. Without Sable installed, this jar simply is not present (ADR-0006).
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ascension_worlds"
type = "required"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "BOTH"

# Air aboard ships (ADR-0026) registers a ship space with the atmosphere api.
[[dependencies.${mod_id}]]
modId = "ascension_atmosphere"
type = "required"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "BOTH"

# Required, and pinned: the ship transfer uses Sable's internal save and load, so a Sable version
# this was not read against must not load it (see sable_version_range in gradle.properties).
[[dependencies.${mod_id}]]
modId = "sable"
type = "required"
versionRange = "${sable_version_range}"
ordering = "AFTER"
side = "BOTH"
