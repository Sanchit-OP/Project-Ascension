modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Sanchit-OP/Project-Ascension/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Ascension Compat: Sable"
authors = "${mod_authors}"
description = '''
Carries Create Aeronautics ships between a planet's surface and space, crew and all, through
Sable's own ship save and load: a ship leaving a world is saved there and loaded into the next,
so its machinery comes with it.

Optional. Without Sable installed, this jar simply is not present (ADR-0006).
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ascension_worlds"
type = "required"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "BOTH"

# Required, and pinned: the ship transfer uses Sable's internal save and load, so a Sable version
# this was not read against must not load it (see sable_version_range in gradle.properties).
[[dependencies.${mod_id}]]
modId = "sable"
type = "required"
versionRange = "${sable_version_range}"
ordering = "AFTER"
side = "BOTH"
